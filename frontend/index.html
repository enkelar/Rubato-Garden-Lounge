    <script>
  (function () {
    try {
      if (location.pathname !== '/') return;
      var lang = localStorage.getItem('rg_lang') === 'sq' ? 'sq' : 'en';
      var url = '/api/menu?lang=' + lang;
      var p = fetch(url, { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('fail'); return r.json(); });
      window.__RG_EARLY__ = { url: url, promise: p };
      p.then(function (json) {
        (json.categories || []).slice(0, 8).forEach(function (c) {
          if (c.cover) new Image().src = c.cover;
        });
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
